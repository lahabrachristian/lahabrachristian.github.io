title: Get involved
intro: Church is more than a Sunday service. Find community, grow together, and
  serve throughout the week.
photo: /images/community.jpg
photo_description: Neighbors gathered at the church car show, seen from above
photo_position: 50% 50%
ministries_label: Ministries
ministries_heading: Find your *place*
ministries:
  - name: Children’s Ministry
    detail: 6 weeks – 5th grade
    description: Helping children discover God’s love in a fun, nurturing
      environment through engaging lessons, games and friendships.
  - name: Fusion Youth
    detail: Students
    description: Empowering the next generation to grow in their relationship with
      Christ through weekly gatherings, events and service.
  - name: Young Adults
    detail: College & young pros
    description: Connect with peers, deepen your faith and navigate life together.
  - name: Women’s Ministry
    detail: All ages
    description: A supportive community where women grow in faith, build friendships
      and serve others.
  - name: Men’s Ministry
    detail: All ages
    description: Men connecting, supporting each other and growing stronger in their
      walk with Christ.
  - name: ESL Ministry
    detail: Tuesdays · 6:30 PM · Room 6
    description: A fun group that loves to worship and practice conversational
      English. Open to all levels.
  - name: Benevolence
    detail: Helping neighbors
    description: Practical help and support for people in need in our community.
weekly_label: During the week
weekly_heading: Weekly *gatherings*
weekly:
  - day: TUES
    title: Women's group - 11:00 AM
    text: "Join on zoom! "
  - day: WED
    title: Prayer Group - 9:30 AM
    text: Meet in the chapel and let's pray together!
  - day: WED
    title: Creative Art Class - 10:00 AM
    text: Open to every skill level. Relax, learn and connect through art. Meet in
      room 6.
  - day: THU
    title: Women's Growth Group - 6:30 AM
    text: Study Scripture, share life and pray with other women. Meet in room 1.
  - day: THU
    title: Growth Group - 6:30 PM
    text: Study Scripture, share life and pray together in a smaller setting, hosted
      by Joe Laubie. Meet in room 6
  - day: FRI
    title: Fusion Youth - 6:00 PM to 8:00PM
    text: A place where every student belongs, come as you are and bring a friend!
      Meet in room 8.
  - day: FRI
    title: ESL class - 6:30 PM to 8:00 PM
    text: Free English classes in a friendly and welcoming space. All levels
      welcome! Meet in room 6
  - day: FRI
    title: "Chinese Bible Study "
    text: A warm mandarin speaking group where we study the bible, share life, and
      pray for on another. Contact Wendy or Mary.
