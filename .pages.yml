media:
  input: images
  output: /images
  rename: safe
  extensions:
  - jpg
  - jpeg
  - png
  - webp
  - gif
content:
- name: events
  label: 📅 Events
  type: collection
  path: _events
  format: yaml-frontmatter
  exclude:
  - .gitkeep
  filename: '{date}-{title}.md'
  view:
    fields:
    - title
    - date
    - time
    primary: title
    sort:
    - date
    - title
    default:
      sort: date
      order: asc
  fields:
  - name: title
    label: Event name
    type: string
    required: true
  - name: date
    label: Date
    type: date
    required: true
    options:
      format: yyyy-MM-dd
  - name: time
    label: Time
    type: string
    description: e.g. 10:00 AM or 6:00 – 8:00 PM
  - name: location
    label: Where
    type: string
    description: Optional, e.g. Fellowship Hall or La Habra Heights Park
  - name: description
    label: Description
    type: text
    description: 'Optional. You can add a link like this: [words](https://link.com)'
  - name: photo
    label: Photo
    type: image
    description: Optional. Events show on the Get Involved page and disappear by themselves after the date passes.
  subfolders: false
- name: gallery
  label: 📷 Photo gallery
  type: file
  path: _data/gallery.yml
  format: yaml
  fields:
  - name: photos
    label: Photos
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{caption}'
    description: Photos show in a “Life at LHCC” section on the Get Involved page. Leave empty to hide the section.
    fields:
    - name: photo
      label: Photo
      type: image
    - name: caption
      label: Caption
      type: string
      description: Optional, e.g. Car Show 2026
- name: settings
  label: ⛪ Church info (time, address, phone)
  type: file
  path: _data/settings.yml
  format: yaml
  fields:
  - name: service_time
    label: Sunday service time
    type: string
    description: e.g. 9:30 AM. Updates the top of the home page, menu, footer and the big time on the Sundays page.
  - name: service_day
    label: Service day label
    type: string
    description: e.g. Sundays
  - name: church_name
    label: Church name
    type: string
  - name: short_name
    label: Logo letters (top left)
    type: string
  - name: tagline
    label: Short intro line (top of the page, computer screens)
    type: string
  - name: address_line_1
    label: Address line 1
    type: string
  - name: address_line_2
    label: Address line 2 (city, state, zip)
    type: string
  - name: phone
    label: Phone
    type: string
  - name: email
    label: Email
    type: string
  - name: po_box
    label: Mailing address (P.O. Box)
    type: string
  - name: giving_link
    label: Online giving link
    type: string
  - name: livestream_link
    label: YouTube live link
    type: string
  - name: youtube_link
    label: YouTube channel link
    type: string
  - name: instagram_link
    label: Instagram link
    type: string
  - name: facebook_link
    label: Facebook link
    type: string
  - name: photo_credits
    label: Photo credits (bottom of every page)
    type: text
- name: pastors
  label: 🙏 Pastors
  type: file
  path: _data/pastors.yml
  format: yaml
  list: true
  fields:
  - name: name
    label: Name
    type: string
    required: true
  - name: role
    label: Role
    type: string
    description: e.g. Lead Pastor
  - name: email
    label: Email
    type: string
    description: Optional
  - name: extension
    label: Phone extension
    type: string
    description: Optional, e.g. 101
- name: home
